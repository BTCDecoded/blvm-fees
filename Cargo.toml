[package]
name = "blvm-fees"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
authors = ["Bitcoin Commons Contributors"]
description = "blend and blend-min fee estimators. Reads blvm.upstream.v1 and the native table."
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-fees"
homepage = "https://btcdecoded.org"
keywords = ["bitcoin", "fees"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "blvm-fees"
path = "src/main.rs"
required-features = ["module"]

[lib]
name = "blvm_fees"
path = "src/lib.rs"

[features]
module = ["dep:blvm-sdk", "dep:blvm-node"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=0.8.2"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
blvm-sdk = { version = ">=0.1, <1", optional = true, default-features = false, features = ["node"] }
blvm-node = { version = ">=0.1, <1", optional = true }

[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", tag = "quinn-proto-0.11.15" }
blvm-node = { path = "../blvm-node" }
blvm-sdk = { path = "../blvm-sdk" }
blvm-sdk-macros = { path = "../blvm-sdk/crates/blvm-sdk-macros" }
blvm-protocol = { path = "../blvm-protocol" }
blvm-consensus = { path = "../blvm-consensus" }
blvm-primitives = { path = "../blvm-primitives" }
blvm-secp256k1 = { path = "../blvm-secp256k1" }
blvm-spec-lock = { path = "../blvm-spec-lock" }
blvm-muhash = { path = "../blvm-muhash" }
